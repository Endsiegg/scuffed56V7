 ###---> Welcome to the Road! <><> <><> <><>
 r56.startup.event.01.title: "Welcome to the Scuffed 56V7!"
 r56.startup.event.01.description: "Hello and Greetings from the Scuffed Dev Team!\n\nThe mod is the official continutation of the OG Scuffed 56.\n\n§R--- IMPORTANT ---\n§!This mod is a 40W Combat mod, meaning combat width is set to a 20/40W Style of combat. Please check out tiles to see what their new combat widths are! Also the air is set to the Pre-Range Nerfs that occured during BBA. Please ensure to check our the combat width per tile, and the stats for air.\n\nAlso, if you encounter any bugs or issues, ensure that you don't have any mod conflicts; otherwise, please report them in a detailed manner To any member of the dev team."
 r56.startup.event.01.option_auto: "Continue"
 r56.startup.event.01.option_tt: "Thank you for playing our mod, and have a wonderful day!"
 
