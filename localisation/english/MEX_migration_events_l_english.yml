l_english:

 MEX_migration.1.t:0 "Uncontrolled Mexican Mass Migration"
 MEX_migration.1.d:0 "An unprecedented wave of migration from Mexico is moving north into the United States. The influx of people will place additional demands on American infrastructure, but will also contribute to economic growth and development in the affected states."
 MEX_migration.1.a:0 "Yes"

 MEX_migration.2.t:0 "Mexican Migration Reaches the United States"
 MEX_migration.2.d:0 "A large wave of Mexican migrants has arrived in the United States. The influx will require additional infrastructure and development in several American states."
 MEX_migration.2.a:0 "Yes"

 MEX_uncontrolled_mexican_mass_migration:0 "Uncontrolled Mexican Mass Migration"
 MEX_uncontrolled_mexican_mass_migration_desc:0 "The uncontrolled migration of Mexican citizens to the United States has reduced domestic economic pressure, allowing Mexico to devote fewer resources to consumer goods."